[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "lean-imt/=lib/lean-imt/",
    "poseidon-solidity/=lib/poseidon-solidity/",
]
